---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax lint (PHP ${{ matrix.php }})
    runs-on: [self-hosted, builder02, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup container tools
        run: bash .github/scripts/setup-php-container.sh tools

      - name: Assert workflow runtime contract
        run: bash .github/scripts/assert-workflow-runtime.sh

      - name: Workflow runtime contract self-test
        run: bash tests/test-assert-workflow-runtime.sh

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: PHP syntax check
        run: |
          find application library public bin src -name '*.php' -print0 \
            | xargs -0 -r -n1 -P"$(nproc)" php -l > /dev/null

  audit:
    name: Dependency security audit
    runs-on: [self-hosted, builder02, docker]
    container:
      image: >-
        mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup container tools
        run: bash .github/scripts/setup-php-container.sh tools

      # --locked reads composer.lock directly (no composer install needed in
      # this job); abandoned packages are ignored via the composer.json
      # `config.audit.abandoned` setting.
      - name: composer audit
        run: composer audit --locked
