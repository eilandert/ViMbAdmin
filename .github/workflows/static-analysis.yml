---
name: Static analysis

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan
    runs-on: [self-hosted, builder02, docker]
    container:
      image: >-
        php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
    # Level 3 is the repository floor, level 7 blocks new errors throughout the
    # project, and newly added PHP files must pass level 10 without a baseline.
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh static

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Proxies are gitignored + built at image time; generate them here so this
      # job also verifies bin/generate-proxies.php keeps working (no DB needed).
      - name: Generate Doctrine proxies
        run: php bin/generate-proxies.php

      - name: Test PHPStan ratchet
        run: bash tests/test-phpstan-ratchet.sh

      - name: Run PHPStan
        env:
          PHPSTAN_EVENT_BEFORE: ${{ github.event.before }}
        run: bash tests/lint-phpstan-ratchet.sh
