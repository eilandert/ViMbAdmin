---
name: Static analysis

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan
    runs-on: [self-hosted, builder02, lxc]
    # Level 3 is the repository floor, level 7 blocks new errors throughout the
    # project, and newly added PHP files must pass level 10 without a baseline.
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        # shivammathur/setup-php v2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          extensions: >-
            ctype, dom, gd, gettext, iconv, intl, json, mbstring, pdo,
            pdo_mysql, sodium
          tools: composer:v2, phpstan:2.2.5

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Proxies are gitignored + built at image time; generate them here so this
      # job also verifies bin/generate-proxies.php keeps working (no DB needed).
      - name: Generate Doctrine proxies
        run: php bin/generate-proxies.php

      - name: Test PHPStan ratchet
        run: bash tests/test-phpstan-ratchet.sh

      - name: Run PHPStan
        env:
          PHPSTAN_EVENT_BEFORE: ${{ github.event.before }}
        run: bash tests/lint-phpstan-ratchet.sh
