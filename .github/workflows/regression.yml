---
name: Regression tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Static regression lints — no DB, no install. Fast first signal.    #
  # ------------------------------------------------------------------ #
  static:
    name: Static regression lints
    runs-on: [self-hosted, builder02, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Smarty 5 JS-template escaping (alias [+] button regression)
        run: bash tests/lint-template-escaping.sh

      - name: ZF1 surface must not grow (Phase 0 guard, docs/ZF1-REMOVAL.md)
        run: bash tests/lint-no-new-zend.sh

      - name: 2FA session-hygiene invariants (audit 2026-07-10 MAJOR)
        run: bash tests/lint-2fa-session-hygiene.sh

  # ------------------------------------------------------------------ #
  # Framework-free service unit tests (Phase 1 of docs/ZF1-REMOVAL.md).#
  # No DB: the services depend on the minimal ObjectManager port and   #
  # are exercised against an in-memory fake + plain-PHP entities.      #
  # ------------------------------------------------------------------ #
  unit:
    name: Service unit tests (PHP ${{ matrix.php }})
    runs-on: [self-hosted, builder02, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh runtime

      - name: Install dependencies
        run: >-
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: ViMbAdmin_Service_Domain
        run: php tests/test-service-domain.php

      - name: ViMbAdmin_Service_Admin
        run: php tests/test-service-admin.php

      - name: ViMbAdmin_Service_Mailbox
        run: php tests/test-service-mailbox.php

      - name: ViMbAdmin_Service_Alias
        run: php tests/test-service-alias.php

      - name: ViMbAdmin_Service_Archive
        run: php tests/test-service-archive.php

      - name: ViMbAdmin\Kernel\Router
        run: php tests/test-kernel-router.php

      - name: MCP create input validation (audit 2026-07-10 MAJOR)
        run: php tests/test-mcp-input-validation.php

      - name: QueueRunner path-safety guard (audit 2026-07-10 MAJOR)
        run: php tests/test-queuerunner-path-safe.php

      - name: ViMbAdmin\Kernel\Security\Csrf
        run: php tests/test-kernel-csrf.php

      - name: ViMbAdmin\Kernel\DataTable (server-side pagination protocol)
        run: php tests/test-kernel-datatable.php

      - name: ViMbAdmin\Kernel\Flash\FlashMessages
        run: php tests/test-kernel-flash.php

      - name: ViMbAdmin\Kernel\Session\MagicPropertyStorage
        run: php tests/test-kernel-session-adapter.php

      - name: ViMbAdmin\Kernel\Http\Kernel
        run: php tests/test-kernel-http.php

      - name: ViMbAdmin\Kernel\Controller\MaintenanceController
        run: php tests/test-maintenance-controller.php

      - name: ViMbAdmin\Kernel\Security\Auth
        run: php tests/test-kernel-auth.php

      - name: ViMbAdmin\Kernel native dispatch (Container + Dispatcher)
        run: php tests/test-kernel-dispatch.php

      - name: ViMbAdmin\Kernel\Form (native form core)
        run: php tests/test-kernel-form.php

      - name: ViMbAdmin\Kernel\Config (native INI loader)
        run: php tests/test-kernel-config.php

      - name: ViMbAdmin\Kernel\Session\SessionNamespace (native session)
        run: php tests/test-kernel-session-namespace.php

      - name: ViMbAdmin\Kernel\Bootstrap (native bootstrap, pure pieces)
        run: php tests/test-kernel-bootstrap.php

      - name: ViMbAdmin\Kernel\Mail\Mailer (native mail sender)
        run: php tests/test-kernel-mailer.php

      - name: ViMbAdmin\Kernel\Cli\CliKernel (native CLI dispatcher)
        run: php tests/test-kernel-cli.php

      - name: Native entry point and removed routes
        run: php tests/test-native-entrypoint.php

      - name: Standalone captcha lifecycle
        run: php tests/test-captcha.php

      - name: Date utility behavior
        run: php tests/test-date.php

      - name: String utility behavior
        run: php tests/test-string.php

      - name: Bcrypt password hashing behavior
        run: php tests/test-bcrypt.php

      - name: Native MCP transport
        run: php tests/test-kernel-mcp.php

      - name: ViMbAdmin_Dovecot::passwordVerify (scheme-prefixed hashes)
        run: php tests/test-dovecot-password.php

  # ------------------------------------------------------------------ #
  # Dependency + cache wiring — proves a composer bump (symfony/cache, #
  # doctrine/orm) does not break the Doctrine cache layer at runtime.  #
  # Runs on the two PHP versions that matter: 8.4 (floor) + 8.5 (prod).#
  # ------------------------------------------------------------------ #
  cache-wiring:
    name: Cache wiring (PHP ${{ matrix.php }})
    runs-on: [self-hosted, builder02, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            image: >-
              mirror.gcr.io/library/php@sha256:9cc9310a457019cd6b682109eb3c5dd8bf73498e7d3b9ee5c33d0d0b83d0faf3
          - php: '8.5'
            image: >-
              mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh cache

      - name: Install dependencies
        run: >-
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Assert doctrine/orm is on 3.x (migrated; ORM 2 APIs are gone)
        run: |
          ver=$(composer show doctrine/orm --no-interaction 2>/dev/null \
                | awk '/^versions/ {print $4}')
          echo "doctrine/orm = $ver"
          case "$ver" in
            3.*|v3.*) echo "OK: ORM 3.x" ;;
            2.*|v2.*)
              echo "::error::doctrine/orm $ver is unsupported; expected 3.x"
              exit 1
              ;;
            *)
              echo "::error::doctrine/orm $ver has an unexpected major"
              exit 1
              ;;
          esac

      - name: Cache + ORM bootstrap smoke
        run: php -d apc.enable_cli=1 tests/test-cache-bootstrap.php

      - name: 'Native Doctrine EM factory (WALL #2)'
        run: php tests/test-kernel-em-factory.php

      - name: 'Native Smarty view (WALL #2)'
        run: php tests/test-kernel-smarty-view.php

  # ------------------------------------------------------------------ #
  # Schema drift — loads the shipped SQL into a real MariaDB and proves #
  # the XML mappings produce NO pending changes (phantom-ALTER guard).  #
  # ------------------------------------------------------------------ #
  schema-drift:
    name: Schema has no phantom pending changes
    runs-on: [self-hosted, builder02, docker]
    container:
      image: >-
        mirror.gcr.io/library/php@sha256:19667d836740e24a3ba340532c7349ab59bb961b86f20e3c85a58150644e5e55
    services:
      mariadb:
        image: >-
          mirror.gcr.io/library/mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: vimbadmin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Prepare PHP container for checkout
        run: apt-get update && apt-get install --yes git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP container
        run: bash .github/scripts/setup-php-container.sh runtime

      - name: Install dependencies
        run: >-
          composer install --no-interaction --no-progress --prefer-dist --no-dev

      # The self-hosted docker runner image ships no mysql client.
      - name: ensure mysql client
        run: |
          command -v mysql >/dev/null || {
            apt-get update
            apt-get install --yes --no-install-recommends mariadb-client
          }

      - name: Wait for MariaDB
        run: |
          for _ in $(seq 1 30); do
            if mysql -hmariadb -P3306 -uroot -pci \
              -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MariaDB up"; break
            fi
            sleep 2
          done

      # Step 1: build schema from the XML mappings and assert the mappings are
      # self-consistent (schema-tool --force leaves nothing pending).
      - name: Build schema from mappings — assert no pending diff
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
        run: php tests/test-schema-no-pending.php

      # Step 2: layer the shipped fork SQL (FKs / collations / unique index /
      # non-mappable bits) via the mysql client, which handles the file's
      # PREPARE/EXECUTE guard blocks.
      - name: Apply shipped fork migration SQL
        run: >-
          mysql -hmariadb -P3306 -uroot -pci vimbadmin
          < contrib/migrations/2026-06-fork-schema.sql

      # Step 3: re-diff WITHOUT recreating. This proves the fork SQL did not
      # push the DB out of sync with the mappings (phantom-ALTER regression).
      - name: After fork SQL — assert still no pending diff
        env:
          DB_HOST: mariadb
          DB_PORT: '3306'
          DB_NAME: vimbadmin
          DB_USER: root
          DB_PASS: ci
          SKIP_CREATE: '1'
        run: php tests/test-schema-no-pending.php
